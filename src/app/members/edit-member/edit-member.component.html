<!-- Edit Modal -->
 <h2 mat-dialog-title> Edit Member {{ member.firstName }} {{ member.lastName }}</h2>
<mat-dialog-content>


    <form #editForm="ngForm">
        <input type="hidden" ngModel="{{member.id}}" name="id" class="form-control" id="id" placeholder="ID">
        <div class="form-group">
            <label for="phone">Prenom</label>
            <input type="text" ngModel="{{member.firstName}}" name="firstName" class="form-control" id="firstName" placeholder="Prenom" required>
        </div>
        <div>
            <label for="date">Nom</label>
            <input type="text" ngModel="{{member.lastName}}" name="lastName" class="form-control" id="lastName" placeholder="Nom" required>
        </div>
        <div class="form-group">
            <label for="lieu">Telephone</label> 
            <input type="text" ngModel="{{member.phoneNumber}}" name="phoneNumber" class="form-control" id="phoneNumber" placeholder="Telephone" required>
        </div>
        <div class="form-group">
            <label for="lieu">Sexe</label> 
            <select ngModel="{{member.sex}}" name="sex" class="form-select" aria-label="Default select example" required>
                <option value="M">Masculin</option>
                <option value="F">Feminin</option>
            </select>
        </div>
        <div>
            <label for="lieu">Type</label> 
            <select ngModel="{{member.type}}" name="type" class="form-select" aria-label="Default select example" required>
                <option *ngFor="let tp of typeTypes"
                        [value]="tp">
                    {{TypeMapping[tp]}}
                </option>
            </select>
        </div>
        <div>
            <label for="lieu">Fonction</label>
            <select ngModel="{{member.function}}" name="function" class="form-select" aria-label="Default select example">
                <option [value]="-1">--Choisir--</option>
                <option *ngFor="let function of fonctionTypes"
                        [value]="function">
                    {{FonctionMapping[function]}}
                </option>
            </select>
        </div>
        <div>
            <label for="lieu">Date d'adhesion: {{member.joinDate}}</label> 
            <input type="datetime-local" ngModel="{{member.joinDate}}" name="joinDate" class="form-control" id="joinDate" placeholder="Date d'adhesion" required>
        </div>
        <div>
            <label for="lieu">A une carte membre?</label> 
            <div class="form-check">
                <input ngModel="{{member.memberCard}}" class="form-check-input" type="radio" name="memberCard" value="true" id="flexRadioDefault1">
                <label class="form-check-label" for="flexRadioDefault1">oui</label>
            </div>
            <div class="form-check">
                <input ngModel="{{member.memberCard}}" class="form-check-input" type="radio" name="memberCard" value="false" id="flexRadioDefault2" checked>
                <label class="form-check-label" for="flexRadioDefault2">Non</label>
            </div>
        </div>    
        <!-- <div class="form-group">
        <label for="phone">Image URL</label>
        <input type="text" ngModel="{{member.date}}" name="imageUrl" class="form-control" id="imageUrl" placeholder="Image URL">
        </div> -->
        <div class="modal-footer">
            <button (click)="onNoClick()" id="" data-bs-dismiss="modal" class="btn btn-secondary">Fermer</button>
            <button  (click)="onUpdateMember(editForm.value)" data-bs-dismiss="modal" class="btn btn-primary" >Enregistrer</button>
        </div>
    </form>
</mat-dialog-content>
